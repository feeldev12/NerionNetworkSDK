plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'me.feeldev'
version = '2.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

// Bytecode stays at Java 17 so the same SDK jar loads in Minecraft 1.20.1 (which runs on
// Java 17) as well as 1.21.x (Java 21). `release` also rejects any Java 18+ API at compile time.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// The jar is also a mod with no code (Fabric, Forge, NeoForge), so a game loads ONE copy that
// every mod shares instead of each mod nesting its own. Its metadata gets the version here.
processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand props
    }
}

base {
    archivesName = 'nerion-network-sdk'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
}

// A stable module name for Forge/NeoForge (they put every mod jar in its own module).
jar {
    manifest {
        attributes('Automatic-Module-Name': 'me.feeldev.nerionnetwork')
    }
}
