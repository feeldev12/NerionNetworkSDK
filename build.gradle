plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'me.feeldev'
version = '1.4.3'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

// Bytecode stays at Java 17 so the same SDK jar loads in Minecraft 1.20.1 (which runs on
// Java 17) as well as 1.21.x (Java 21). `release` also rejects any Java 18+ API at compile time.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

base {
    archivesName = 'nerion-p2p-sdk'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.slf4j:slf4j-api:2.0.7"
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.7"
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
}
